<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">   
            <p class="h3">Lista de Alunos</p>
        </div>
        <div class="col text-end">
            <app-students />
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Curso</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (student of paginatedStudents(); track student.id) {
                        <tr>
                            <td>{{ student.id }}</td>
                            <td>{{ student.name }}</td>
                            <td>{{ student.course }}</td>
                            <td>
                                <span
                                    [class]="student.status === 'paid' ? 'badge text-bg-success' : 'badge text-bg-warning'">
                                    {{ student.status === 'paid' ? 'Pago' : 'Pendente' }}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1">Editar</button>
                                <button class="btn btn-sm btn-outline-danger">Excluir</button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>

        </div>
        <div class="d-flex justify-content-end">
            <ul class="pagination">

                <li class="page-item" [class.disabled]="currentPage() === 1">
                    <a class="page-link" (click)="goToPage(currentPage() - 1)">«</a>
                </li>

                @for (page of pages(); track page) {
                <li class="page-item" [class.active]="page === currentPage()">
                    <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
                </li>
                }

                <li class="page-item" [class.disabled]="currentPage() === totalPages()">
                    <a class="page-link" (click)="goToPage(currentPage() + 1)">»</a>
                </li>

            </ul>
        </div>

    </div>
</div>
